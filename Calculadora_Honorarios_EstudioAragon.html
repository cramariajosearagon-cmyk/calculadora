<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Honorarios - Estudio Contable Aragón</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif; background: #f5f5f5; color: #333; padding: 20px; line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 30px; }
        h1 { color: #6C4E83; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #999; margin-bottom: 30px; font-size: 14px; }
        .parametros { background: #f9f9f9; padding: 20px; border-radius: 6px; margin-bottom: 30px; border: 1px solid #eee; }
        .param-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 15px; }
        .param-group { display: flex; flex-direction: column; }
        label { font-size: 13px; font-weight: 600; color: #666; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="number"], input[type="text"], select { padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; width: 100%; }
        input[type="number"]:focus, input[type="text"]:focus, select:focus { outline: none; border-color: #6C4E83; box-shadow: 0 0 0 3px rgba(108, 78, 131, 0.1); }
        details summary { font-weight: 500; padding: 10px 0; color: #6C4E83; cursor: pointer; }
        details[open] summary { margin-bottom: 15px; }
        .tareas-container { margin-bottom: 30px; }
        .categoria { margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px solid #eee; }
        .categoria-titulo { font-size: 12px; font-weight: 700; color: #666; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
        .botones-tareas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
        button.agregar-tarea { padding: 10px 12px; background: #fff; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 13px; text-align: left; transition: all 0.15s; }
        button.agregar-tarea:hover { background: #f0ede7; border-color: #6C4E83; }
        .tareas-seleccionadas { margin-bottom: 30px; }
        button.descargar-pdf { padding: 10px 20px; background: #6C4E83; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
        button.descargar-pdf:hover { background: #5a3f71; }
        .tarea-item { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 15px; margin-bottom: 15px; }
        .tarea-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .tarea-nombre { font-weight: 600; color: #333; flex: 1; }
        button.eliminar { background: none; border: none; color: #999; font-size: 18px; cursor: pointer; padding: 5px 10px; margin-left: 10px; }
        button.eliminar:hover { color: #d32f2f; }
        .tarea-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 12px; }
        .tarea-result { background: #f0ede7; padding: 10px 12px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .tarea-modulos { color: #666; }
        .tarea-pesos { font-weight: 600; color: #333; font-size: 15px; }
        .total-section { background: linear-gradient(135deg, #6C4E83 0%, #5a3f71 100%); color: white; padding: 20px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }
        .total-label { font-weight: 500; }
        .total-valor { font-size: 24px; font-weight: 700; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; }
        input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        .btn-container { text-align: center; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Calculadora de Honorarios</h1>
        <p class="subtitle">Estudio Contable Aragón</p>
        
        <div class="parametros">
            <div class="param-row">
                <div class="param-group">
                    <label for="moduloValor">Valor del Módulo (ARS)</label>
                    <input type="number" id="moduloValor" value="3693" step="1" min="0">
                </div>
                <div class="param-group">
                    <label for="nombreCliente">Nombre del Cliente</label>
                    <input type="text" id="nombreCliente" placeholder="Ej: Juan García">
                </div>
            </div>
            
            <details class="toggle-section">
                <summary>⚙️ Valores Específicos (Editar)</summary>
                <div class="param-row">
                    <div class="param-group">
                        <label for="sueldosBase">Base Sueldos (primeros 4 empleados)</label>
                        <input type="number" id="sueldosBase" value="128000" step="1000" min="0">
                    </div>
                    <div class="param-group">
                        <label for="sueldosPorEmpleado">Por empleado adicional</label>
                        <input type="number" id="sueldosPorEmpleado" value="18500" step="500" min="0">
                    </div>
                </div>
            </details>
        </div>
        
        <div class="tareas-container">
            <h2 style="margin-bottom: 20px; font-size: 18px; color: #333;">Agregar Tarea</h2>
            
            <div class="categoria">
                <div class="categoria-titulo">📊 Tributaria - Mensuales</div>
                <div class="botones-tareas">
                    <button class="agregar-tarea" onclick="agregarTarea({id:'ib_bs_as_m',nombre:'IB Buenos Aires (mensual)',tipo:'impuesto',alta:50,media:30,baja:20})">IB Buenos Aires (mensual)</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'ib_convenio_m',nombre:'IB Convenio Multilateral (mensual)',tipo:'impuesto_convenio_m'})">IB Convenio Multilateral (mensual)</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'iva_m',nombre:'IVA (mensual)',tipo:'impuesto',alta:55,media:40,baja:25})">IVA (mensual)</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'sicore',nombre:'SICORE (mensual)',tipo:'impuesto',alta:85,media:50,baja:35})">SICORE (mensual)</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'tsh',nombre:'TSH / Municipalidad',tipo:'impuesto',alta:20,media:12,baja:5})">TSH / Municipalidad</button>
                </div>
            </div>
            
            <div class="categoria">
                <div class="categoria-titulo">📊 Tributaria - Anuales (Prorrateo ÷12)</div>
                <div class="botones-tareas">
                    <button class="agregar-tarea" onclick="agregarTarea({id:'ib_bs_as_a',nombre:'IB Buenos Aires (anual)',tipo:'impuesto',alta:80,media:60,baja:40,prorrateable:true})">IB Buenos Aires (anual)</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'ib_convenio_a',nombre:'IB Convenio Multilateral (anual)',tipo:'impuesto',alta:175,media:90,baja:50,prorrateable:true})">IB Convenio Multilateral (anual)</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'ganancias_pj',nombre:'Ganancias PJ (anual)',tipo:'impuesto',alta:400,media:225,baja:135,prorrateable:true})">Ganancias PJ (anual)</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'ganancia_minima',nombre:'Ganancia Mínima Presunta (anual)',tipo:'impuesto',alta:125,media:65,baja:35,prorrateable:true})">Ganancia Mínima Presunta (anual)</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'bienes_personales_acciones',nombre:'Bienes Personales, Acciones y Participaciones (anual)',tipo:'impuesto',alta:130,media:90,baja:55,prorrateable:true})">Bienes Personales, Acciones (anual)</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'ganancias_pf',nombre:'Ganancias PF (anual)',tipo:'impuesto',alta:335,media:190,baja:115,prorrateable:true})">Ganancias PF (anual)</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'bienes_personales',nombre:'Bienes Personales (anual)',tipo:'impuesto',alta:110,media:65,baja:45,prorrateable:true})">Bienes Personales (anual)</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'monotributo_cat',nombre:'Monotributo Categorización/Recategorización',tipo:'monotributo'})">Monotributo Categorización</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'participaciones',nombre:'Participaciones Societarias (anual)',tipo:'impuesto',alta:35,media:35,baja:35,prorrateable:true})">Participaciones Societarias</button>
                </div>
            </div>
            
            <div class="categoria">
                <div class="categoria-titulo">📄 Servicios</div>
                <div class="botones-tareas">
                    <button class="agregar-tarea" onclick="agregarTarea({id:'facturacion',nombre:'Servicio de Facturación',tipo:'servicios',baja:2,media:4,cantidad:true})">Servicio de Facturación</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'veps',nombre:'Generación de VEPs',tipo:'servicios',baja:2,media:4,cantidad:true})">Generación de VEPs</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'consulta',nombre:'Consulta Profesional',tipo:'consulta'})">Consulta Profesional</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'especifico',nombre:'Tarea Específica',tipo:'especifico'})">Tarea Específica</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'sueldos',nombre:'Liquidación de Sueldos',tipo:'laboral_especial'})">Liquidación de Sueldos</button>
                    <button class="agregar-tarea" onclick="agregarTarea({id:'ajuste_final',nombre:'Descuento/Ajuste Final',tipo:'ajuste'})">Descuento/Ajuste Final</button>
                </div>
            </div>
        </div>
        
        <div id="tareasSeleccionadas" class="tareas-seleccionadas" style="display:none;">
            <h2 style="font-size: 18px; color: #333; margin-bottom: 20px;">Tareas Seleccionadas</h2>
            <div id="listaTareas"></div>
            <div id="totalContainer"></div>
            
            <div class="btn-container">
                <button class="descargar-pdf" onclick="descargarPDF()">⬇️ Descargar PDF</button>
            </div>
        </div>
    </div>

    <script>
        let tareas = [];
        const moduloInput = document.getElementById('moduloValor');
        const nombreClienteInput = document.getElementById('nombreCliente');
        const sueldosBaseInput = document.getElementById('sueldosBase');
        const sueldosPorEmpleadoInput = document.getElementById('sueldosPorEmpleado');
        
        function cargarDatos() {
            const saved = localStorage.getItem('calculadora_datos');
            if (saved) {
                const datos = JSON.parse(saved);
                moduloInput.value = datos.modulo || 3693;
                nombreClienteInput.value = datos.nombreCliente || '';
                sueldosBaseInput.value = datos.sueldosBase || 128000;
                sueldosPorEmpleadoInput.value = datos.sueldosPorEmpleado || 18500;
                tareas = datos.tareas || [];
            }
        }
        
        function guardarDatos() {
            localStorage.setItem('calculadora_datos', JSON.stringify({
                modulo: parseFloat(moduloInput.value),
                nombreCliente: nombreClienteInput.value,
                sueldosBase: parseFloat(sueldosBaseInput.value),
                sueldosPorEmpleado: parseFloat(sueldosPorEmpleadoInput.value),
                tareas: tareas
            }));
            actualizarUI();
        }
        
        function agregarTarea(datos) {
            const id = Math.random().toString(36).substr(2, 9);
            const nuevaTarea = { id, ...datos, complejidad: 'media' };
            
            if (datos.tipo === 'laboral_especial') {
                nuevaTarea.empleados = 1;
            } else if (datos.tipo === 'consulta') {
                nuevaTarea.duracion = 60;
            } else if (datos.tipo === 'especifico') {
                nuevaTarea.nombreEspecifico = '';
                nuevaTarea.horas = 1;
            } else if (datos.tipo === 'servicios') {
                nuevaTarea.cantidad = 1;
                nuevaTarea.complejidad = 'baja';
            } else if (datos.tipo === 'monotributo') {
                nuevaTarea.alta = 27;
                nuevaTarea.media = 20;
                nuevaTarea.baja = 15;
                nuevaTarea.prorrateable = true;
            } else if (datos.tipo === 'impuesto_convenio_m') {
                nuevaTarea.complejidad = 'baja';
            } else if (datos.tipo === 'ajuste') {
                nuevaTarea.monto = 0;
            }
            
            tareas.push(nuevaTarea);
            guardarDatos();
        }
        
        function eliminarTarea(id) {
            tareas = tareas.filter(t => t.id !== id);
            guardarDatos();
        }
        
        function actualizarTarea(id, cambios) {
            tareas = tareas.map(t => t.id === id ? { ...t, ...cambios } : t);
            guardarDatos();
        }
        
        function calcularHonorario(tarea) {
            const modulo = parseFloat(moduloInput.value) || 3693;
            
            if (tarea.tipo === 'ajuste') {
                return { pesos: -(parseFloat(tarea.monto) || 0), modulos: null };
            }
            
            if (tarea.tipo === 'laboral_especial') {
                const base = parseFloat(sueldosBaseInput.value) || 128000;
                const porEmpleado = parseFloat(sueldosPorEmpleadoInput.value) || 18500;
                const empleadosAdicionales = Math.max(0, tarea.empleados - 4);
                return { pesos: base + (empleadosAdicionales * porEmpleado), modulos: null };
            }
            
            if (tarea.tipo === 'consulta') {
                const mod = (tarea.duracion / 60) * 20;
                return { pesos: mod * modulo, modulos: mod };
            }
            
            if (tarea.tipo === 'especifico') {
                const mod = tarea.horas * 20;
                return { pesos: mod * modulo, modulos: mod };
            }
            
            if (tarea.tipo === 'servicios') {
                const mpi = tarea.complejidad === 'baja' ? tarea.baja : tarea.media;
                const mt = mpi * tarea.cantidad;
                return { pesos: mt * modulo, modulos: mt };
            }
            
            if (tarea.tipo === 'monotributo') {
                let valor = tarea[tarea.complejidad];
                let pf = valor * modulo;
                let modulos = valor;
                
                if (tarea.prorratea) {
                    pf = (valor * modulo) / 6;
                    modulos = valor / 6;
                }
                
                return { pesos: pf, modulos: modulos };
            }
            
            if (tarea.tipo === 'impuesto_convenio_m') {
                let valor = 30;
                if (tarea.complejidad === 'media') valor = 35;
                if (tarea.complejidad === 'alta') valor = 65;
                return { pesos: valor * modulo, modulos: valor };
            }
            
            let valor = tarea[tarea.complejidad];
            if (valor === null) return { pesos: 0, modulos: 0 };
            
            let pf = valor * modulo;
            if (tarea.prorratea) pf = pf / 12;
            return { pesos: pf, modulos: valor };
        }
        
        function actualizarUI() {
            const container = document.getElementById('tareasSeleccionadas');
            const lista = document.getElementById('listaTareas');
            if (tareas.length === 0) { container.style.display = 'none'; return; }
            container.style.display = 'block';
            lista.innerHTML = '';
            
            tareas.forEach(tarea => {
                const { pesos, modulos } = calcularHonorario(tarea);
                let html = `<div class="tarea-item"><div class="tarea-header"><div class="tarea-nombre">${tarea.nombre}</div><button class="eliminar" onclick="eliminarTarea('${tarea.id}')">✕</button></div><div class="tarea-controls">`;
                
                if (['impuesto', 'impuesto_convenio_m'].includes(tarea.tipo)) {
                    html += `<div class="param-group"><label>Complejidad</label><select onchange="actualizarTarea('${tarea.id}', {complejidad: this.value})"><option value="baja" ${tarea.complejidad === 'baja' ? 'selected' : ''}>Baja</option><option value="media" ${tarea.complejidad === 'media' ? 'selected' : ''}>Media</option><option value="alta" ${tarea.complejidad === 'alta' ? 'selected' : ''}>Alta</option></select></div>`;
                }
                
                if (tarea.tipo === 'monotributo') {
                    html += `<div class="param-group"><label>Complejidad</label><select onchange="actualizarTarea('${tarea.id}', {complejidad: this.value})"><option value="baja" ${tarea.complejidad === 'baja' ? 'selected' : ''}>Baja (15 módulos)</option><option value="media" ${tarea.complejidad === 'media' ? 'selected' : ''}>Media (20 módulos)</option><option value="alta" ${tarea.complejidad === 'alta' ? 'selected' : ''}>Alta (27 módulos)</option></select></div>`;
                }
                
                if (tarea.tipo === 'servicios') {
                    html += `<div class="param-group"><label>Complejidad</label><select onchange="actualizarTarea('${tarea.id}', {complejidad: this.value})"><option value="baja" ${tarea.complejidad === 'baja' ? 'selected' : ''}>Baja (${tarea.baja} módulos)</option><option value="media" ${tarea.complejidad === 'media' ? 'selected' : ''}>Media (${tarea.media} módulos)</option></select></div>`;
                }
                
                if (tarea.prorrateable) {
                    const texto = tarea.tipo === 'monotributo' ? 'En abono (÷6)' : 'En abono (÷12)';
                    html += `<div class="checkbox-group"><input type="checkbox" id="prorratea_${tarea.id}" ${tarea.prorratea ? 'checked' : ''} onchange="actualizarTarea('${tarea.id}', {prorratea: this.checked})"><label for="prorratea_${tarea.id}" style="margin: 0;">${texto}</label></div>`;
                }
                
                if (tarea.tipo === 'laboral_especial') {
                    html += `<div class="param-group"><label>Empleados</label><input type="number" value="${tarea.empleados}" min="1" onchange="actualizarTarea('${tarea.id}', {empleados: parseInt(this.value)})"></div>`;
                }
                
                if (tarea.tipo === 'consulta') {
                    html += `<div class="param-group"><label>Duración</label><select onchange="actualizarTarea('${tarea.id}', {duracion: parseInt(this.value)})"><option value="30" ${tarea.duracion === 30 ? 'selected' : ''}>30 min</option><option value="45" ${tarea.duracion === 45 ? 'selected' : ''}>45 min</option><option value="60" ${tarea.duracion === 60 ? 'selected' : ''}>1 hora</option></select></div>`;
                }
                
                if (tarea.tipo === 'especifico') {
                    html += `<div class="param-group"><label>Nombre</label><input type="text" value="${tarea.nombreEspecifico}" placeholder="Ej: Auditoría especial" onchange="actualizarTarea('${tarea.id}', {nombreEspecifico: this.value})"></div><div class="param-group"><label>Horas</label><input type="number" value="${tarea.horas}" min="0.5" step="0.5" onchange="actualizarTarea('${tarea.id}', {horas: parseFloat(this.value)})"></div>`;
                }
                
                if (tarea.tipo === 'servicios' && tarea.cantidad) {
                    html += `<div class="param-group"><label>Cantidad</label><input type="number" value="${tarea.cantidad}" min="1" onchange="actualizarTarea('${tarea.id}', {cantidad: parseInt(this.value)})"></div>`;
                }
                
                if (tarea.tipo === 'ajuste') {
                    html += `<div class="param-group"><label>Monto a Descontar (ARS)</label><input type="number" value="${tarea.monto || 0}" step="1" onchange="actualizarTarea('${tarea.id}', {monto: parseFloat(this.value)})"></div>`;
                }
                
                html += `</div><div class="tarea-result"><span class="tarea-modulos">${modulos ? modulos.toFixed(2) + ' módulos' : ''}</span><span class="tarea-pesos">${pesos < 0 ? '-' : ''}ARS ${Math.abs(pesos).toLocaleString('es-AR', { maximumFractionDigits: 0 })}</span></div></div>`;
                
                lista.innerHTML += html;
            });
            
            const total = tareas.reduce((acc, tarea) => acc + calcularHonorario(tarea).pesos, 0);
            document.getElementById('totalContainer').innerHTML = `<div class="total-section"><span class="total-label">Total mensual a cobrar</span><span class="total-valor">ARS ${total.toLocaleString('es-AR', { maximumFractionDigits: 0 })}</span></div>`;
        }
        
        function descargarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const hoy = new Date().toLocaleDateString('es-AR');
            const modulo = parseFloat(moduloInput.value) || 3693;
            const cliente = nombreClienteInput.value || 'Sin especificar';
            
            doc.setFont('Arial', 'normal');
            doc.setFontSize(10);
            doc.text('Estudio Contable Aragón', 20, 20);
            
            doc.setFontSize(16);
            doc.setFont('Arial', 'bold');
            doc.text('Presupuesto de Honorarios', 20, 32);
            
            doc.setFont('Arial', 'normal');
            doc.setFontSize(10);
            doc.text(`Cliente: ${cliente}`, 20, 42);
            
            doc.setTextColor(150);
            doc.text(`Fecha: ${hoy}`, 20, 50);
            doc.setTextColor(0);
            doc.text(`Módulo: ARS ${modulo}`, 20, 58);
            
            let yPos = 70;
            
            doc.setFont('Arial', 'bold');
            doc.setFontSize(9);
            doc.text('Descripción', 20, yPos);
            doc.text('Importe', 180, yPos, { align: 'right' });
            yPos += 4;
            doc.setLineWidth(0.5);
            doc.line(20, yPos, 200, yPos);
            yPos += 6;
            
            doc.setFont('Arial', 'normal');
            doc.setFontSize(9);
            
            tareas.forEach(tarea => {
                const { pesos } = calcularHonorario(tarea);
                let label = tarea.nombre;
                if (tarea.tipo === 'especifico' && tarea.nombreEspecifico) label = tarea.nombreEspecifico;
                
                const lines = doc.splitTextToSize(label, 140);
                lines.forEach(line => { doc.text(line, 20, yPos); yPos += 4; });
                doc.text(`ARS ${pesos.toLocaleString('es-AR', { maximumFractionDigits: 0 })}`, 180, yPos - (lines.length * 4) + 4, { align: 'right' });
                yPos += 2;
            });
            
            yPos += 4;
            doc.setLineWidth(0.5);
            doc.line(20, yPos, 200, yPos);
            yPos += 6;
            
            const total = tareas.reduce((acc, tarea) => acc + calcularHonorario(tarea).pesos, 0);
            
            doc.setFont('Arial', 'bold');
            doc.setFontSize(11);
            doc.text('Total Mensual', 20, yPos);
            doc.text(`ARS ${total.toLocaleString('es-AR', { maximumFractionDigits: 0 })}`, 180, yPos, { align: 'right' });
            
            doc.save(`Presupuesto_${cliente}_${new Date().toISOString().split('T')[0]}.pdf`);
        }
        
        moduloInput.addEventListener('change', guardarDatos);
        nombreClienteInput.addEventListener('change', guardarDatos);
        sueldosBaseInput.addEventListener('change', guardarDatos);
